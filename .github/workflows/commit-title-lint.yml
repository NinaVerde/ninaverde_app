name: PR title lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
          requireScope: false
          subjectPattern: ".+"
          subjectPatternError: "PR title must include a subject after the type, e.g. `chore: update CI`"

  comment:
    name: comment
    needs: lint
    if: ${{ always() && needs.lint.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            **PR title check** found an issue.
            Please rename to Conventional Commits style, e.g.:
            - `feat: add profile page`
            - `fix: handle null token`
            - `chore: update CI`
