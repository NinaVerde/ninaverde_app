name: ninaverde_app
description: Nicaragua Niña Verde mobile app
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.9
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Core / Utils
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.0
  intl: ^0.20.2
  crypto: ^3.0.7

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.4.0
  firebase_auth_platform_interface: ^8.1.5
  cloud_firestore: ^6.3.0

  # Social sign-in
  sign_in_with_apple: ^8.0.0
  google_sign_in: ^7.2.0

  # Media
  video_player: ^2.11.1
  youtube_player_iframe: ^6.0.0
  audioplayers: ^6.6.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.1.0
  http: ^1.6.0
  firebase_storage: ^13.3.0
  image_picker: ^1.2.2
  model_viewer_plus: ^1.7.2
  share_plus: ^12.0.2
  firebase_messaging: ^16.2.0
  file_picker: ^11.0.2
  csv: ^8.0.0

  # Animations
  flutter_animate: ^4.5.2

  # WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # Game / Stage
  flame: ^1.37.0
  flame_audio: ^2.12.1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  
  # Notifications & Scheduling
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  google_fonts: ^8.1.0
  vector_math: ^2.2.0
  path: ^1.9.1
  translator: ^1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/kitchen/
    - assets/images/avatar/
    - assets/images/angelina/
    - assets/images/sequences/
    # Explicit carousel sequence folders for reliable loading
    - assets/images/sequences/vybz_eventos/
    - assets/images/sequences/desayuno_wtf/
    - assets/images/sequences/cafes/
    - assets/images/sequences/la_parrillada/
    - assets/images/sequences/la_cocina/
    - assets/images/sequences/smoothies/
    - assets/images/sequences/los_postres/
    - assets/images/sequences/los_helados/
    - assets/images/sequences/microgreens/
    - assets/images/sequences/equipo/
    - assets/images/sequences/minoristas/

    - assets/legal/
    - assets/videos/Illuminated_Circles_Remastered_1080p.mp4
    - assets/videos/nina_verde_intro.mp4
    - assets/audio/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 400

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#000000"
  image: assets/images/app_icon_foreground.png
  android_12:
    image: assets/images/app_icon_foreground.png
    icon_background_color: "#000000"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_foreground.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
